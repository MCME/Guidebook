name: Guidebook
main: com.mcmiddleearth.guidebook.GuidebookPlugin
version: ${version}
description: Welcomes players to the places they enter with a title and a short description.
load: POSTWORLD
# WorldEdit: Areas are placed from selections, and polygon Areas use its polygon rule.
# PluginUtils parses the 1.x Legacy markup that Area files are converted from on first start.
depend: [ WorldEdit, PluginUtils ]
# Dynmap: Guidebook draws on it only if it's already enabled.
softdepend: [ dynmap ]
api-version: '${apiVersion}'

permissions:
    guidebook.staff:
        description: Gives access to all guidebook commands
        default: op
    guidebook.user:
        description: Gives access to /guidebook on, off and help
        default: true
