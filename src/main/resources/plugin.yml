name: Guidebook
main: com.mcmiddleearth.guidebook.GuidebookPlugin
version: ${version}
description: Welcomes players to the places they enter with a title and a short description.
load: POSTWORLD
# Staff place and select Areas with WorldEdit selections, so create, move and select can't work without it
depend: [WorldEdit]
# Multiverse-Core loads its worlds in its own onEnable. Saved areas look their world up by name
# on load, so Guidebook must enable after Multiverse or those lookups return null.
softdepend: [Multiverse-Core, PluginUtils, dynmap]
api-version: '${apiVersion}'

permissions:
    guidebook.staff:
        description: Gives access to all guidebook commands
        default: op
    guidebook.user:
        description: Gives access to /guidebook on, off and help
        default: true
